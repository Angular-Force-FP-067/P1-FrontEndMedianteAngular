<div class="card shadow-sm" style="width: 18rem;" *ngIf="jugador">
  <img [src]="jugador.foto" class="card-img-top" [alt]="jugador.nombre" 
       style="height: 250px; object-fit: cover;">
  
  <div class="card-body text-center">
    <h5 class="card-title text-uppercase fw-bold">
      {{ jugador.nombre }} {{ jugador.apellidos }}
    </h5>
    <p class="badge bg-primary mb-2">{{ jugador.posicion }}</p>
    
    <ul class="list-group list-group-flush text-start">
      <li class="list-group-item small"><strong>Edad:</strong> {{ jugador.edad }} años</li>
      <li class="list-group-item small"><strong>Altura:</strong> {{ jugador.altura }} m</li>
    </ul>
    
    <div class="mt-3">
      <button class="btn btn-outline-secondary btn-sm">Ver Estadísticas</button>
    </div>
  </div>
</div>

<div *ngIf="!jugador" class="alert alert-info">
  Selecciona un jugador para ver sus detalles.
</div>
