<div class="container mt-4">
  <div *ngIf="player; else notFound">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <app-detail [jugador]="player"></app-detail>
      </div>

      <div class="col-md-8 mt-3">
        <app-media [titulo]="'Vídeo de ' + player.nombre" [videoUrl]="player.videoURL"></app-media>
      </div>
    </div>
  </div>

  <ng-template #notFound>
    <div class="alert alert-warning">Jugador no encontrado.</div>
  </ng-template>
</div>
